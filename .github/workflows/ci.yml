name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (core + dev, no ml extra)
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Strict typing on the frozen contract surface. This is the gate that
      # keeps Contract 1 honest across every module that compiles against it.
      - name: Type-check core
        run: uv run mypy interlock/core

      - name: Tests
        run: uv run pytest -q --ignore=tests/chaos -m "not slow"

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install console dependencies
        run: npm --prefix console ci

      - name: Console unit tests
        run: npm --prefix console run test:unit -- --run

      - name: Console typecheck
        run: npm --prefix console run typecheck

      - name: Console production build
        run: npm --prefix console run build
