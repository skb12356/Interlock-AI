<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Interlock — one stakes estimate, two budgets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d18"/>
      <stop offset="52%" stop-color="#080907"/>
      <stop offset="100%" stop-color="#2a2e26"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8b4a0"/>
      <stop offset="100%" stop-color="#9ad17f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#e6e1d7" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M60 0V300M120 0V300M180 0V300M1020 0V300M1080 0V300M1140 0V300"/>
  </g>

  <!-- The mark: two links, woven. Same shape the console shows on a new session. -->
  <g transform="translate(78 86) scale(1.3)">
    <mask id="weave">
      <rect x="-20" y="-20" width="180" height="160" fill="white"/>
      <rect x="4" y="14" width="52" height="58" rx="26" fill="none" stroke="black" stroke-width="16"/>
    </mask>
    <rect x="38" y="14" width="52" height="58" rx="26" fill="none" stroke="#9ad17f" stroke-width="7" mask="url(#weave)"/>
    <rect x="4" y="14" width="52" height="58" rx="26" fill="none" stroke="#c8b4a0" stroke-width="7"/>
  </g>

  <text x="220" y="150" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="76"
        font-weight="600" letter-spacing="-2" fill="#f8f7f5">Interlock</text>
  <text x="224" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21"
        letter-spacing="6" fill="#9aa08c">AI CONTROL PLANE</text>

  <rect x="224" y="216" width="300" height="3" rx="2" fill="url(#rule)"/>

  <text x="1104" y="132" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="22" letter-spacing="3" fill="#c8b4a0">ONE STAKES ESTIMATE</text>
  <text x="1104" y="170" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="22" letter-spacing="3" fill="#9ad17f">TWO BUDGETS</text>
</svg>
