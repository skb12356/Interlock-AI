[project]
name = "interlock"
version = "0.1.0"
description = "An AI control plane: one stakes estimate drives both the router and the guardrail."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# Core dependency set: everything the spine needs, deliberately light so the
# gateway always starts. Heavy ML wheels live in the `ml` extra and are
# installed by the task that first needs them (see P0.2 in TODO.md).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "duckdb>=1.1",
    "pysbd>=0.3.4",
    "pyahocorasick>=2.1",
]

[project.optional-dependencies]
# Deferred: installed at the task that needs them, not up front.
ml = [
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "onnxruntime>=1.19",
    "optimum[onnxruntime]>=1.22",
    "presidio-analyzer>=2.2",
    "sqlite-vec>=0.1.6",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pre-commit>=3.8",
]

[project.scripts]
interlock = "interlock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interlock"]

# ---------------------------------------------------------------- ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["interlock", "tests"]
# Ruff formats fenced Python inside Markdown. The spec documents are the frozen
# source of truth for the contracts -- never rewrite them.
extend-exclude = ["*.md", "Implementation/", "docs/"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async correctness -- load-bearing here
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ---------------------------------------------------------------- mypy ----
# Strict on core/ -- it is the frozen contract every other module compiles
# against (Implementation03 §7 Definition of Done).
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "interlock.core.*"
strict = true
disallow_any_generics = true
warn_return_any = true

# -------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "contract: validates a frozen interface contract (1-5)",
    "property: Hypothesis property test",
    "chaos: failure-injection test",
    "slow: needs model weights or network",
]
